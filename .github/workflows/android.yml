name: Build Mirage APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q mirage-native-build.zip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
        working-directory: mirage-native
      - run: npx cap add android
        working-directory: mirage-native
      - name: Make icon background
        working-directory: mirage-native
        run: |
          python3 - <<'EOF'
          import zlib, struct
          w = h = 1024
          raw = (b'\x00' + bytes([14, 15, 18]) * w) * h
          def ch(t, d):
              c = struct.pack('>I', len(d)) + t + d
              return c + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
          png = b'\x89PNG\r\n\x1a\n' + ch(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)) + ch(b'IDAT', zlib.compress(raw)) + ch(b'IEND', b'')
          open('assets/icon-background.png', 'wb').write(png)
          EOF
      - run: npx capacitor-assets generate --android
        working-directory: mirage-native
      - run: npx cap sync android
        working-directory: mirage-native
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: mirage-native/android
      - uses: actions/upload-artifact@v4
        with:
          name: Mirage-apk
          path: mirage-native/android/app/build/outputs/apk/debug/app-debug.apk
