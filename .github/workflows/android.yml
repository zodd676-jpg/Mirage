name: Build Mirage APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q mirage-native-build.zip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
        working-directory: mirage-native
      - run: npx cap add android
        working-directory: mirage-native
      - run: npx capacitor-assets generate --android --iconBackgroundColor '#0e0f12' --iconBackgroundColorDark '#0e0f12'
        working-directory: mirage-native
      - run: npx cap sync android
        working-directory: mirage-native
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: mirage-native/android
      - uses: actions/upload-artifact@v4
        with:
          name: Mirage-apk
          path: mirage-native/android/app/build/outputs/apk/debug/app-debug.apk
